<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Near battlefield band: treeline, artillery battery silhouettes and the
       broken rail fences that give the ridge its identity. Transparent above
       the horizon so the far layer reads through it. -->
  <path d="M0 858 L180 806 L360 852 L540 800 L760 848 L980 796 L1200 846 L1420 798 L1640 850 L1920 804 L1920 1080 L0 1080 Z" fill="#2c2612"/>
  <!-- Treeline clumps. -->
  <ellipse cx="180" cy="800" rx="96" ry="54" fill="#1e2410" opacity="0.9"/>
  <ellipse cx="286" cy="818" rx="70" ry="40" fill="#1e2410" opacity="0.9"/>
  <ellipse cx="1636" cy="796" rx="104" ry="58" fill="#1e2410" opacity="0.9"/>
  <ellipse cx="1750" cy="816" rx="76" ry="42" fill="#1e2410" opacity="0.9"/>
  <!-- Far artillery battery: barrel, carriage, wheel. -->
  <g fill="#171a0d">
    <rect x="828" y="792" width="150" height="15"/>
    <rect x="880" y="806" width="76" height="30"/>
    <circle cx="900" cy="842" r="26"/>
    <circle cx="962" cy="842" r="26"/>
  </g>
  <g fill="#171a0d">
    <rect x="1210" y="800" width="132" height="13"/>
    <rect x="1256" y="812" width="66" height="26"/>
    <circle cx="1272" cy="844" r="22"/>
    <circle cx="1324" cy="844" r="22"/>
  </g>
  <!-- Broken rail fence running the width of the near band. -->
  <g fill="#3d2b14">
    <rect x="60" y="796" width="14" height="80"/>
    <rect x="240" y="802" width="14" height="74"/>
    <rect x="470" y="792" width="14" height="84"/>
    <rect x="700" y="806" width="14" height="70"/>
    <rect x="1120" y="798" width="14" height="78"/>
    <rect x="1400" y="804" width="14" height="72"/>
    <rect x="1700" y="794" width="14" height="82"/>
    <rect x="60" y="812" width="424" height="9"/>
    <rect x="60" y="842" width="196" height="9"/>
    <rect x="1120" y="818" width="300" height="9"/>
    <rect x="1400" y="846" width="316" height="9"/>
  </g>
  <!-- Low drifting powder smoke. -->
  <ellipse cx="620" cy="866" rx="230" ry="46" fill="#5a5541" opacity="0.20"/>
  <ellipse cx="1460" cy="874" rx="260" ry="42" fill="#5a5541" opacity="0.17"/>
</svg>
